<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adresář kontaktů</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Adresář kontaktů</h1>

    <div class="form-box">
      <input type="text" id="name" placeholder="Jméno">
      <input type="text" id="phone" placeholder="Telefon">
      <input type="email" id="email" placeholder="E-mail">
      <button onclick="addContact()">Přidat kontakt</button>
    </div>

    <div class="search-box">
      <input type="text" id="search" placeholder="Hledat podle jména" oninput="renderContacts()">
    </div>

    <ul id="contactList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
