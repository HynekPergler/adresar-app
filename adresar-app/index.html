<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adresář kontaktů</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Adresář kontaktů</h1>

    <div class="form-box">
      <input type="text" id="name" placeholder="Jméno">
      <input type="text" id="phone" placeholder="Telefon">
      <input type="email" id="email" placeholder="E-mail">
      <div class="button-row">
        <button id="saveButton" onclick="addContact()">Přidat kontakt</button>
        <button id="cancelEditButton" onclick="clearForm()" style="display:none;">Zrušit editaci</button>
        <button onclick="exportCsv()">Export CSV</button>
        <button onclick="createBackup()">Záloha DB</button>
      </div>
    </div>
  </div>

<div class="search-box">
  <input type="text" id="search" placeholder="Hledat podle jména, telefonu nebo e-mailu" oninput="renderContacts()">
</div>

<ul id="contactList"></ul>

  <script src="script.js"></script>
</body>
</html>
